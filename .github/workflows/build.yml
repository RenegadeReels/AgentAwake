name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build AgentAwake.app
        run: ./build-app.sh

      - name: Zip the app
        run: |
          cd build
          ditto -c -k --keepParent AgentAwake.app AgentAwake-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AgentAwake-macOS
          path: build/AgentAwake-macOS.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/AgentAwake-macOS.zip \
            --title "AgentAwake $GITHUB_REF_NAME" \
            --notes "Download AgentAwake-macOS.zip, unzip it, and move AgentAwake.app to Applications. See the README for first-launch steps."
